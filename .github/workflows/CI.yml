name: T2E - Build then Push to ECR (dev branches)

on:
  push:
    branches:
      - "dev-*"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 850213989260.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: t2e

jobs:
  build:
    name: BUILD
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag_sha: ${{ steps.meta.outputs.tag_sha }}
      tag_latest: ${{ steps.meta.outputs.tag_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH="$(echo "$BRANCH" | tr '/:_ ' '-' )"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag_sha=dev-${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_latest=dev-${SAFE_BRANCH}-latest" >> $GITHUB_OUTPUT

      - name: Build image (local)
        run: |
          docker build -t local-image:build .

      - name: Save image to artifact (tar)
        run: |
          docker save local-image:build -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  push:
    name: PUSH
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: |
          docker load -i image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          TAG_SHA="${{ needs.build.outputs.tag_sha }}"
          TAG_LATEST="${{ needs.build.outputs.tag_latest }}"

          docker tag local-image:build "${IMAGE}:${TAG_SHA}"
          docker tag local-image:build "${IMAGE}:${TAG_LATEST}"

          docker push "${IMAGE}:${TAG_SHA}"
          docker push "${IMAGE}:${TAG_LATEST}"
