name: T2E - Build then Push to ECR (dev branches)

on:
  push:
    branches:
      - "dev-*"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 850213989260.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: t2e

jobs:
  build:
    name: BUILD
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag_sha: ${{ steps.meta.outputs.tag_sha }}
      tag_latest: ${{ steps.meta.outputs.tag_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - Repo tree (top)
        run: |
          echo "PWD: $(pwd)"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          ls -la
          echo "---- code/t2e ----"
          ls -la ./code/t2e || true

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH="$(echo "$BRANCH" | tr '/:_ ' '-' )"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag_sha=dev-${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_latest=dev-${SAFE_BRANCH}-latest" >> $GITHUB_OUTPUT

          echo "Computed:"
          echo "  image=$IMAGE"
          echo "  tag_sha=dev-${SAFE_BRANCH}-${SHORT_SHA}"
          echo "  tag_latest=dev-${SAFE_BRANCH}-latest"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug - Dockerfile presence
        run: |
          test -f ./code/t2e/Dockerfile && echo "Dockerfile OK: ./code/t2e/Dockerfile" || (echo "Dockerfile NOT FOUND" && exit 1)

      - name: Build image to OCI layout dir (linux/amd64)
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          TAG_SHA="${{ steps.meta.outputs.tag_sha }}"
          TAG_LATEST="${{ steps.meta.outputs.tag_latest }}"

          rm -rf oci-image
          mkdir -p oci-image

          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE}:${TAG_SHA}" \
            -t "${IMAGE}:${TAG_LATEST}" \
            --output type=oci,dest=oci-image,tar=false \
            ./code/t2e

      - name: Debug - OCI layout contents
        run: |
          echo "---- oci-image ----"
          ls -la oci-image
          echo "Expecting index.json + blobs/"
          test -f oci-image/index.json && echo "index.json OK" || (echo "index.json MISSING" && exit 1)
          test -d oci-image/blobs && echo "blobs/ OK" || (echo "blobs/ MISSING" && exit 1)

      - name: Upload OCI layout artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-image
          path: oci-image
          retention-days: 1

  push:
    name: PUSH
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download OCI layout artifact
        uses: actions/download-artifact@v4
        with:
          name: oci-image
          path: oci-image

      - name: Debug - downloaded OCI layout
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "---- oci-image ----"
          ls -la oci-image
          test -f oci-image/index.json && echo "index.json OK" || (echo "index.json MISSING" && exit 1)
          test -d oci-image/blobs && echo "blobs/ OK" || (echo "blobs/ MISSING" && exit 1)

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push tags to ECR (no rebuild)
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          TAG_SHA="${{ needs.build.outputs.tag_sha }}"
          TAG_LATEST="${{ needs.build.outputs.tag_latest }}"

          echo "Pushing:"
          echo "  ${IMAGE}:${TAG_SHA}"
          echo "  ${IMAGE}:${TAG_LATEST}"

          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG_SHA}" \
            --tag "${IMAGE}:${TAG_LATEST}" \
            oci-layout://oci-image

      - name: Debug - confirm remote manifest exists
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          TAG_SHA="${{ needs.build.outputs.tag_sha }}"
          TAG_LATEST="${{ needs.build.outputs.tag_latest }}"

          echo "Inspecting pushed manifests:"
          docker buildx imagetools inspect "${IMAGE}:${TAG_SHA}"
          docker buildx imagetools inspect "${IMAGE}:${TAG_LATEST}"